services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: benchforge-workbench
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  benchforge-tui:
    build:
      context: ./rust-tui
      dockerfile: Dockerfile
    container_name: benchforge-tui
    stdin_open: true
    tty: true
    volumes:
      - ./benchforge.toml:/app/benchforge.toml
      - ./exports:/app/exports
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - BENCHFORGE_THEME=${BENCHFORGE_THEME:-dark}
      - BENCHFORGE_CONCURRENCY=${BENCHFORGE_CONCURRENCY:-3}
      - BENCHFORGE_TIMEOUT=${BENCHFORGE_TIMEOUT:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - tui

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: benchforge-litellm
    ports:
      - "4100:4100"
    volumes:
      - ./litellm.config.yaml:/app/litellm.config.yaml:ro
    command: ["--config", "/app/litellm.config.yaml", "--port", "4100", "--host", "0.0.0.0"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - litellm
    restart: unless-stopped
