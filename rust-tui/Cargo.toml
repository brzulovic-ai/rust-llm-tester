[package]
name = "benchforge-tui"
version = "0.1.0"
edition = "2021"
description = "Rust TUI LLM Multi-Tester & Benchmark Workbench with full TOML/env/CLI configuration"
license = "Apache-2.0"

[[bin]]
name = "benchforge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
directories = "5.0"
futures = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"
